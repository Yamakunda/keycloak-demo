version: "3.8"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # Set KC_HOSTNAME=<domain ngrok/cloudflare, vd: xxxx.ngrok-free.app> trước khi
      # `docker compose up` để WebAuthn rpId khớp origin thật điện thoại đang gọi.
      # Để trống thì Keycloak tự suy hostname từ request (đủ cho luồng localhost bình thường).
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      # ngrok gửi X-Forwarded-Proto/Host (không phải header "Forwarded" chuẩn RFC 7239),
      # nên phải dùng "xforwarded" để Keycloak nhận đúng scheme https từ ngrok.
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
      - ./keycloak-theme-for-kc-26.0-to-26.1.jar:/opt/keycloak/providers/keycloak-theme.jar
      - ./keycloak-spi-qr-login/target/qr-login-spi.jar:/opt/keycloak/providers/qr-login-spi.jar
      # Giữ DB (user, passkey/credential, dữ liệu tạo qua Admin Console) qua các lần
      # restart/recreate container. Lưu ý: vì import dùng strategy IGNORE_EXISTING,
      # một khi volume đã có dữ liệu, sửa test-realm.json sẽ KHÔNG tự áp dụng lại —
      # phải `docker volume rm keycloak_keycloak-db` để ép re-import từ đầu.
      - keycloak-db:/opt/keycloak/data/h2
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


  razor-app:
    build: ./razor-demo
    container_name: razor-app
    ports:
      - "5100:5100"
    # Toàn bộ config Keycloak (ServerUrl/Realm/ClientId/ClientSecret) đọc từ .env,
    # không hardcode ở đây. Browser redirect và backchannel đều dùng localhost:8080;
    # extra_hosts map "localhost" → host-gateway để issuer khớp.
    env_file:
      - ./razor-demo/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-api:
    build: ./bookstore-api
    container_name: bookstore-api
    ports:
      - "3003:3003"
    # Config (PORT/REALM/CLIENT_SECRET…) đọc từ .env qua env_file, không hardcode.
    # Introspection gọi localhost:8080 → cần extra_hosts giống razor-app.
    env_file:
      - ./bookstore-api/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  demo-keycloak:
    build: ./demo-keycloak
    container_name: demo-keycloak
    # SPA static: biến REACT_APP_* đã nhúng vào bundle lúc build image;
    # mọi request (Keycloak, bookstore-api) đều do browser gọi, không cần env runtime.
    ports:
      - "3002:3002"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-api-2:
    build: ./bookstore-api-2
    container_name: bookstore-api-2
    ports:
      - "3013:3013"
    # Exchange code lấy token diễn ra ở đây (backend), không phải bookstore-fe-2 —
    # client_secret + redirect_uri (Keycloak client test-client-2) chỉ nằm ở .env này.
    env_file:
      - ./bookstore-api-2/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-fe-2:
    build: ./bookstore-fe-2
    container_name: bookstore-fe-2
    # SPA static: biến REACT_APP_* đã nhúng vào bundle lúc build image (xem .dockerignore);
    # mọi request (Keycloak /login, bookstore-api-2) đều do browser gọi, không cần env runtime.
    ports:
      - "3012:3012"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-api-oauth:
    build: ./bookstore-api-oauth
    container_name: bookstore-api-oauth
    ports:
      - "3023:3023"
    # Bản OAuth demo: giống bookstore-api-2 nhưng dùng client test-client-oauth
    # và bộ port riêng (API 3023, FE 3022) để chạy song song với stack -2.
    env_file:
      - ./bookstore-api-oauth/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-fe-oauth:
    build: ./bookstore-fe-oauth
    container_name: bookstore-fe-oauth
    # SPA static: biến REACT_APP_* nhúng vào bundle lúc build image;
    # browser gọi thẳng Keycloak :8080 và bookstore-api-oauth :3023.
    ports:
      - "3022:3022"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-api-mobile:
    build: ./bookstore-api-mobile
    container_name: bookstore-api-mobile
    ports:
      - "3043:3043"
    # Backend cho app Android (bookstore-android): verify JWT bằng JWKS,
    # không cần client_secret vì client passwordless-demo là public client.
    env_file:
      - ./bookstore-api-mobile/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-api-qr:
    build: ./bookstore-api-qr
    container_name: bookstore-api-qr
    ports:
      - "3053:3053"
    # Backend trung gian cho QR cross-device login (OAuth2 Device Authorization Grant):
    # giữ client_secret của client confidential qr-login-confidential, FE (bookstore-fe-qr)
    # chỉ gọi API này, không đụng Keycloak trực tiếp.
    env_file:
      - ./bookstore-api-qr/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-fe-qr:
    build: ./bookstore-fe-qr
    container_name: bookstore-fe-qr
    # SPA static: hiển thị QR (verification_uri_complete) và poll bookstore-api-qr
    # cho tới khi điện thoại (bookstore-android-biometric) quét & approve xong.
    ports:
      - "3052:3052"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-fe-qr-2:
    build: ./bookstore-fe-qr-2
    container_name: bookstore-fe-qr-2
    # SPA static: OAuth client public thật (Authorization Code + PKCE, client
    # test-qr-web-2), redirect thẳng vào trang login mặc định của Keycloak để test
    # Authenticator SPI "Đăng nhập bằng QR" qua cơ chế "Try another way" —
    # xem ../keycloak-spi-qr-login. Khác bookstore-fe-qr (tự vẽ QR bằng JS, không đụng
    # trang login Keycloak).
    ports:
      - "3060:3060"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-saml-api:
    build: ./bookstore-saml-api
    container_name: bookstore-saml-api
    ports:
      - "3033:3033"
    # Demo SAML 2.0: backend là Service Provider, Keycloak là IdP (client bookstore-saml).
    # Giữ SAML session (cookie httpOnly) và phục vụ JSON API cho bookstore-saml-fe.
    # Lúc khởi động app fetch IdP metadata từ localhost:8080 → cần extra_hosts như razor-app.
    env_file:
      - ./bookstore-saml-api/.env
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  bookstore-saml-fe:
    build: ./bookstore-saml-fe
    container_name: bookstore-saml-fe
    # SPA static: REACT_APP_API_URL nhúng vào bundle lúc build image;
    # FE không đụng SAML/Keycloak — login/logout là redirect sang bookstore-saml-api.
    ports:
      - "3032:3032"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  # OpenLDAP demo — nguồn user cho Keycloak User Federation (LDAP) trên realm "test".
  # Seed sẵn 2 user (alice/bob, mật khẩu Password123) qua ldap/bootstrap.ldif.
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: Bookstore
      LDAP_DOMAIN: bookstore.local
      LDAP_BASE_DN: dc=bookstore,dc=local
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
      - ./ldap/bootstrap.ldif:/root/bootstrap.ldif:ro
    networks:
      - keycloak-net

  # UI web để xem/sửa cây LDAP — http://localhost:6443 (login: cn=admin,dc=bookstore,dc=local / admin)
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "6443:80"
    depends_on:
      - openldap
    networks:
      - keycloak-net

networks:
  keycloak-net:
    driver: bridge

volumes:
  keycloak-db:
  openldap-data:
  openldap-config:
